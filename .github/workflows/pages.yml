# Tests every push and PR, and deploys the site to GitHub Pages only when the
# tests pass. Settings → Pages → Build and deployment → Source is "GitHub Actions"
# (see the "Deploying" section of README.md).
#
# Every deploy also publishes a fresh snapshot of SWR's service status
# (data/swr/status.json, from scripts/swr-snapshot.js), and the schedule below
# redeploys every 15 minutes to keep it current. Scheduled runs can start late.
name: Test and deploy to Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Run unit tests
        run: npm test

      # `node --check a.js b.js` only checks a.js, so check each file in turn.
      - name: Check JavaScript syntax
        run: |
          for f in js/*.js tests/*.js scripts/*.js; do
            node --check "$f"
          done

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time; let a running deploy finish rather than cancel it.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - uses: actions/configure-pages@v6

      # Publish only the site, not the README, plan, tests or package.json.
      # data/ holds the weekly SWR snapshots (committed by swr-weekly.yml); the
      # status snapshot is fetched fresh here. If SWR's website is down, the
      # site deploys without it (the SWR tab copes).
      - name: Stage site files
        run: |
          rm -rf _site
          mkdir _site
          cp -R index.html css js data _site/
          touch _site/.nojekyll
          node scripts/swr-snapshot.js --status --out _site/data/swr \
            || echo "::warning::SWR status snapshot failed; deploying without a fresh status.json"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site/
          include-hidden-files: true   # keep .nojekyll

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
